# Twikoo 2.0 持续集成门禁（T40 / §4.4）
#
# 4 个并行门禁 job（lint / typecheck / test / build）+ 2 个守卫 job：
#   - baseline：阶段 0 的三条基线（engines.node / .nvmrc / 8 包 version）
#   - agents-staleness：改了规则相关文件却未同步 AGENTS.md → 只警告不阻塞（§12.1）
#
# 注：workflows 自身的静态检查（actionlint + 结构断言）在 lint job 中通过
#     `pnpm run check:workflows` 一并执行。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Guard — no .js sources under packages/*/src
        run: pnpm run check:no-js

      - name: Guard — workflow actionlint + structure assertions
        run: pnpm run check:workflows

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # A 类密钥（§9.4）：仓库未配置对应 Secret 时为空字符串 → hasEnv() 判定未配置
      # → 对应用例整体 skip（不失败、不伪造），fork PR 同样能跑绿。
      TEST_SMTP_HOST: ${{ secrets.TEST_SMTP_HOST }}
      TEST_SMTP_PORT: ${{ secrets.TEST_SMTP_PORT }}
      TEST_SMTP_USER: ${{ secrets.TEST_SMTP_USER }}
      TEST_SMTP_PASS: ${{ secrets.TEST_SMTP_PASS }}
      TEST_PUSHOO_CHANNEL: ${{ secrets.TEST_PUSHOO_CHANNEL }}
      TEST_PUSHOO_TOKEN: ${{ secrets.TEST_PUSHOO_TOKEN }}
      TEST_AKISMET_KEY: ${{ secrets.TEST_AKISMET_KEY }}
      TEST_AKISMET_BLOG: ${{ secrets.TEST_AKISMET_BLOG }}
      TEST_TENCENT_SECRET_ID: ${{ secrets.TEST_TENCENT_SECRET_ID }}
      TEST_TENCENT_SECRET_KEY: ${{ secrets.TEST_TENCENT_SECRET_KEY }}
      TEST_AI_API_KEY: ${{ secrets.TEST_AI_API_KEY }}
      TEST_AI_BASE_URL: ${{ secrets.TEST_AI_BASE_URL }}
      TEST_IMAGE_BED_TOKEN: ${{ secrets.TEST_IMAGE_BED_TOKEN }}
      TEST_QQ_API_URL: ${{ secrets.TEST_QQ_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (Vitest projects)
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Docs site build
        run: pnpm --filter twikoo-docs docs:build

  baseline:
    name: Baseline guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Guard — engines.node / .nvmrc / 8 publishable versions
        run: node scripts/check-baseline.mjs

  agents-staleness:
    name: AGENTS.md staleness (warning only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Warn when rule files changed without AGENTS.md
        run: node scripts/check-agents-staleness.mjs --base "${{ github.event.pull_request.base.sha }}"
