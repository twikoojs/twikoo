# Twikoo 2.0 持续集成门禁（T40 / §4.4）
#
# 4 个并行门禁 job（lint / typecheck / test / build），互不 needs。
#
# 草稿 PR 不跑 CI：每个 job 带 `if: github.event.pull_request.draft == false`，
# 并在 `pull_request.types` 里显式加上 `ready_for_review`——**两者缺一不可**：
#   - 少了 `if`：草稿 PR 会照跑，白烧 CI 分钟数；
#   - 少了 `ready_for_review`：该活动类型**不在** GitHub 的默认触发集
#     （默认只有 opened / synchronize / reopened），于是「草稿点 Ready for review」
#     根本不会触发工作流，CI 要等下一次 push 才启动（静默空档，很难发现）。
#
# 注：`push` 事件下 `github.event.pull_request` 为 null，而 GitHub 表达式是宽松相等
#     （null→0、false→0），故 `null == false` 求值为 **true** —— push 到 main 不受影响。
#
# 以下守卫项一律由**人工核对**，不设 CI 检查：
#   - 基线（engines.node / .nvmrc / 8 个发布包 version）
#   - AGENTS.md 与仓库现状是否同步
#   - workflow 静态检查（actionlint + 结构断言）
#   - packages/*/src 无 .js 源码
#   - 适配器 dependencies 完整性
#   - .env.example 变量清单一致性

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # 默认只有 opened / synchronize / reopened；补 ready_for_review 才能让
    # 「草稿转为可评审」这一动作触发 CI（否则要等下一次 push）
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  lint:
    name: Lint
    # 草稿 PR 不跑（push 事件下 github.event.pull_request 为 null，null == false 为 true）
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

  test:
    name: Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # A 类密钥（§9.4）：仓库未配置对应 Secret 时为空字符串 → hasEnv() 判定未配置
      # → 对应用例整体 skip（不失败、不伪造），fork PR 同样能跑绿。
      TEST_SMTP_HOST: ${{ secrets.TEST_SMTP_HOST }}
      TEST_SMTP_PORT: ${{ secrets.TEST_SMTP_PORT }}
      TEST_SMTP_USER: ${{ secrets.TEST_SMTP_USER }}
      TEST_SMTP_PASS: ${{ secrets.TEST_SMTP_PASS }}
      TEST_PUSHOO_CHANNEL: ${{ secrets.TEST_PUSHOO_CHANNEL }}
      TEST_PUSHOO_TOKEN: ${{ secrets.TEST_PUSHOO_TOKEN }}
      TEST_AKISMET_KEY: ${{ secrets.TEST_AKISMET_KEY }}
      TEST_AKISMET_BLOG: ${{ secrets.TEST_AKISMET_BLOG }}
      TEST_TENCENT_SECRET_ID: ${{ secrets.TEST_TENCENT_SECRET_ID }}
      TEST_TENCENT_SECRET_KEY: ${{ secrets.TEST_TENCENT_SECRET_KEY }}
      TEST_AI_API_KEY: ${{ secrets.TEST_AI_API_KEY }}
      TEST_AI_BASE_URL: ${{ secrets.TEST_AI_BASE_URL }}
      TEST_IMAGE_BED_TOKEN: ${{ secrets.TEST_IMAGE_BED_TOKEN }}
      TEST_QQ_API_URL: ${{ secrets.TEST_QQ_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (Vitest projects)
        run: pnpm test

  build:
    name: Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm (version from package.json packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Docs site build
        run: pnpm --filter twikoo-docs docs:build
