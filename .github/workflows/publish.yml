# Twikoo 2.0 发布工作流
#
# 文件名与显示名和 1.x 对齐：`publish.yml` / `Publish`（1.x 为 `.github/workflows/publish.yml`）。
#
# 触发方式：**人工在 GitHub 网页创建 Release**（不提供 workflow_dispatch，不自动创建 Release）。
#   - Release tag 即最终版本号（容忍 `v` 前缀，CI 统一 strip）
#   - 「Set as a pre-release」勾选框决定 npm dist-tag：勾了 → beta，未勾 → latest
#   - 版本号不进入 git：仓库内 9 个发布包恒为 0.0.0，仅在本工作流中覆写后发布
#
# 发布顺序（**单阶段**：9 包一次性并行发布，不按依赖分批）：
#   validate → publish（9 包矩阵，fail-fast）→ verify gate（9 包全部在 npm 可见）
#   → docker → pkg SEA 产物上传到已有 Release
#
# 预发布与正式版走**同一套流程**，只有 tag 不同（都由「Set as a pre-release」决定）：
#   - npm：dist-tag = beta / latest
#   - Docker：通道 tag 同源于 npm dist-tag（`:beta` / `:latest`），两种情况都另打精确版本号 tag
#   - SEA 产物：`gh release upload` 挂到该 Release，预发布同样执行
#   - **arm32v7 镜像只在正式版发布**（预发布只出 amd64 / arm64）
#
# npm 鉴权：**OIDC 信任发布**（trusted publishing），全程不使用任何 npm token ——
#   靠上面的 `id-token: write` 换取短时令牌。前置条件（缺一不可）：
#   1. 每个包都要在 npmjs.com 上配置 Trusted Publisher：Owner `twikoojs` /
#      Repository `twikoo` / Workflow filename `publish.yml`（Environment 留空，
#      与工作流一致；文件名逐字符匹配，含 `.yml`）；
#   2. `package.json` 的 `repository.url` 必须与发布仓库一致，否则报
#      「Repository URL mismatch」；
#   3. **OIDC 只能用于已存在的包** —— 新包名必须先用 token 手动发布一次占位版本，
#      否则无法在 npmjs.com 上进入该包的 Settings 配置信任发布。
#      `@twikoojs/shared` / `@twikoojs/common` / `@twikoojs/aws-lambda`
#      已于 2026-09-20 各发一个 0.0.1 占位包完成占名。
#   `--provenance` 在信任发布下会自动生效，这里显式保留只为让意图清晰。
#
# 为什么不分批：`npm publish` 并不校验 dependencies 是否已存在于 registry，依赖
# `@twikoojs/common` 的适配器与 common 同批发布不会失败；而分批要多等一轮 gate
# （每轮最长 600s），npm 的可见性延迟本身只有几分钟——分批只增加发布总耗时。

name: Publish

permissions:
  contents: write
  id-token: write

on:
  release:
    types: [published]

env:
  NODE_VERSION: "26"
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  validate:
    name: 校验版本（格式 / 基线 / 单调性 / 未发布过）
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      npm_tag: ${{ steps.resolve.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: 解析并校验 Release tag
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::Release tag \"$TAG\" 不是合法版本号（期望 x.y.z 或 x.y.z-beta.n）"
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then NPM_TAG=beta; else NPM_TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "版本号 ${VERSION}（npm dist-tag: ${NPM_TAG}）"
      - name: 基线校验（9 个发布包 version 必须为 0.0.0）
        run: node scripts/release-set-version.mjs --check
      - name: 单调性校验（新版本必须大于已发布的最高同线版本）
        run: node scripts/release-version-check.mjs monotonic "${{ steps.resolve.outputs.version }}"
      - name: 未发布过校验
        run: node scripts/release-version-check.mjs unpublished "${{ steps.resolve.outputs.version }}"

  publish:
    name: 发布 · ${{ matrix.package }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: "@twikoojs/shared"
            dir: packages/shared
          - package: "@twikoojs/common"
            dir: packages/server-common
          - package: pushoo
            dir: packages/pushoo
          - package: twikoo
            dir: packages/client
          - package: twikoo-func
            dir: packages/server-cloudbase
          - package: twikoo-vercel
            dir: packages/server-vercel
          - package: tkserver
            dir: packages/server-self-hosted
          - package: twikoo-netlify
            dir: packages/server-netlify
          - package: "@twikoojs/aws-lambda"
            dir: packages/server-aws-lambda
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: 覆写版本号
        run: node scripts/release-set-version.mjs "${{ needs.validate.outputs.version }}"
      - name: 构建（含其依赖）
        run: pnpm --filter "${{ matrix.package }}..." build
      - name: 发布到 npm（OIDC 信任发布，无 token；E403 等错误直接失败，不吞）
        working-directory: ${{ matrix.dir }}
        env:
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
        run: npm publish --provenance --tag "$NPM_TAG"

  verify:
    name: Gate · 9 个包在 npm 可见
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: node scripts/verify-npm.mjs "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.npm_tag }}"

  publish-docker:
    name: Docker 镜像
    needs: [validate, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # 通道 tag 与 npm dist-tag 同源（validate 已解析）：正式版 → latest，预发布 → beta。
      # 两种情况都另打精确版本号 tag，便于固定到某个具体版本。
      - name: 构建并推送 amd64 / arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            imaegoo/twikoo:${{ needs.validate.outputs.npm_tag }}
            imaegoo/twikoo:${{ needs.validate.outputs.version }}
      # arm32v7 只在正式版发布：预发布不构建该架构
      - name: 构建并推送 arm32v7
        if: ${{ !github.event.release.prerelease }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7
          push: true
          tags: |
            imaegoo/twikoo:arm32v7
            imaegoo/twikoo:${{ needs.validate.outputs.version }}-arm32v7
          build-args: NODE_IMAGE=arm32v7/node

  publish-pkg:
    name: SEA 可执行产物
    needs: [validate, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # 宿主 Node 必须 ≥ 25.7（tsdown 的 exe 选项依赖较新的 SEA API）；
          # SEA 产物的**目标运行时**由 packages/pkg/tsdown.config.mts 的
          # exe.targets[].nodeVersion 决定（= 26.9.0，须为完整 x.y.z）。
          # 两者含义不同（宿主 vs 目标运行时），当前都落在 Node 26 线。
          node-version: "26"
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: 覆写版本号（SEA 产物内的版本号取自 @twikoojs/shared，须与本次发布一致）
        run: node scripts/release-set-version.mjs "${{ needs.validate.outputs.version }}"
      - name: 构建 SEA 依赖的 workspace 产物（shared / pushoo / common / tkserver 等）
        run: pnpm -r --if-present --filter "twikoo-pkg..." run build
      - name: 构建 SEA 产物（目标运行时 nodeVersion 见 packages/pkg/tsdown.config.mts）
        run: pnpm --filter twikoo-pkg build:exe
      - name: 上传产物到已有 Release（不创建 Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" packages/pkg/dist/* --clobber
