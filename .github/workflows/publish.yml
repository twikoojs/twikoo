# Twikoo 2.0 发布工作流
#
# 触发方式：**人工在 GitHub 网页创建 Release**。
#   - Release tag 即最终版本号（容忍 `v` 前缀，CI 统一 strip）
#   - 「Set as a pre-release」勾选框决定 npm dist-tag：勾了 → beta，未勾 → latest
#   - 版本号不进入 git：仓库内所有发布包恒为 0.0.0，仅在本工作流中覆写后发布
#
# 发布顺序（**单阶段**：所有包一次性并行发布，不按依赖分批）：
#   validate → publish（所有包矩阵，fail-fast）→ verify gate（所有包全部在 npm 可见）
#   → docker → pkg SEA 产物上传到已有 Release
#
# 预发布与正式版走**同一套流程**，只有 tag 不同（都由「Set as a pre-release」决定）：
#   - npm：dist-tag = beta / latest
#   - Docker：通道 tag 同源于 npm dist-tag（`:beta` / `:latest`），两种情况都另打精确版本号 tag
#   - Docker **arm32v7 镜像只在正式版发布**（预发布只出 amd64 / arm64）
#   - SEA 产物：`gh release upload` 挂到该 Release，预发布同样执行
#
# npm 鉴权：**OIDC 信任发布**（trusted publishing），全程不使用任何 npm token ——
#   靠上面的 `id-token: write` 换取短时令牌。前置条件（缺一不可）：
#   1. 每个包都要在 npmjs.com 上配置 Trusted Publisher：Owner `twikoojs` /
#      Repository `twikoo` / Workflow filename `publish.yml`（Environment 留空）；
#   2. `package.json` 的 `repository.url` 必须与发布仓库一致；
#   3. **OIDC 只能用于已存在的包** —— 新包名必须先用 token 手动发布一次占位版本，
#      否则无法在 npmjs.com 上进入该包的 Settings 配置信任发布。
#   `--provenance` 在信任发布下会自动生效，这里显式保留只为让意图清晰。

name: Publish

permissions:
  contents: write
  id-token: write

on:
  release:
    types: [published]

env:
  NODE_VERSION: "26"
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  validate:
    name: 校验版本（格式 / 基线 / 单调性 / 未发布过）
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      npm_tag: ${{ steps.resolve.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: 解析并校验 Release tag
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::Release tag \"$TAG\" 不是合法版本号（期望 x.y.z 或 x.y.z-beta.n）"
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then NPM_TAG=beta; else NPM_TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "版本号 ${VERSION}（npm dist-tag: ${NPM_TAG}）"
      - name: 基线校验（9 个发布包 version 必须为 0.0.0）
        run: node scripts/release-set-version.mjs --check
      - name: 单调性校验（新版本必须大于已发布的最高同线版本）
        run: node scripts/release-version-check.mjs monotonic "${{ steps.resolve.outputs.version }}"
      - name: 未发布过校验
        run: node scripts/release-version-check.mjs unpublished "${{ steps.resolve.outputs.version }}"

  publish:
    name: 发布 · ${{ matrix.package }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: "@twikoojs/shared"
            dir: packages/shared
          - package: "@twikoojs/common"
            dir: packages/server-common
          - package: pushoo
            dir: packages/pushoo
          - package: twikoo
            dir: packages/client
          - package: twikoo-func
            dir: packages/server-cloudbase
          - package: twikoo-vercel
            dir: packages/server-vercel
          - package: tkserver
            dir: packages/server-self-hosted
          - package: twikoo-netlify
            dir: packages/server-netlify
          - package: "@twikoojs/aws-lambda"
            dir: packages/server-aws-lambda
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: 覆写版本号
        run: node scripts/release-set-version.mjs "${{ needs.validate.outputs.version }}"
      - name: 构建（含其依赖）
        run: pnpm --filter "${{ matrix.package }}..." build
      - name: 发布到 npm（OIDC 信任发布，无 token；E403 等错误直接失败，不吞）
        working-directory: ${{ matrix.dir }}
        env:
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
        # 用 pnpm publish 而非 npm publish：后者不改写 `workspace:` 协议，会把
        # `workspace:*` 原样发到 npm，装包方直接 EUNSUPPORTEDPROTOCOL（2.0.0-beta.1 的教训）。
        # pnpm 打包时会把 workspace 协议换成真实版本号。
        # --no-git-checks：release 触发时检出的是 tag（detached HEAD），过不了 pnpm 的分支校验。
        # --provenance 在信任发布下会自动生效，这里显式保留只为让意图清晰。
        run: pnpm publish --provenance --no-git-checks --tag "$NPM_TAG"

  verify:
    name: Gate · 9 个包在 npm 可见
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: node scripts/verify-npm.mjs "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.npm_tag }}"

  # 文档站（twikoo.js.org）的评论后端跑在 Vercel 上，构建时 `npm install` 会重新解析
  # `twikoo-vercel@latest`。npm 发了新版本后必须重新构建一次才会装上新版，
  # 否则后端仍跑旧代码 —— 此前需要人工到 Vercel 点 Redeploy。
  #
  # 用 Vercel 的 **Deploy Hook**（项目 Settings → Git → Deploy Hooks 创建）：
  # 一次 POST 即触发构建，不需要 Vercel token，hook URL 本身即凭据。
  #
  # 前置（一次性）：把 hook URL 存进仓库 secret `VERCEL_DOCS_BACKEND_DEPLOY_HOOK`。
  # 未配置时**跳过而非失败** —— 不阻塞发版主流程。
  #
  # 依赖 `verify`（9 个包在 npm 可见）而不是 `publish`：只有包真的上线了才值得重建后端。
  redeploy-docs-backend:
    name: 触发文档站后端重新部署
    needs: [validate, verify]
    runs-on: ubuntu-latest
    steps:
      - name: POST Vercel Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DOCS_BACKEND_DEPLOY_HOOK }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "::warning::未配置 secret VERCEL_DOCS_BACKEND_DEPLOY_HOOK，跳过文档站后端重新部署"
            exit 0
          fi
          echo "twikoo-vercel@${VERSION} 已发布，触发文档站后端重新部署"
          code="$(curl -sS -o /tmp/deploy-hook.out -w '%{http_code}' -X POST "${DEPLOY_HOOK}")"
          echo "Deploy Hook 返回 HTTP ${code}"
          cat /tmp/deploy-hook.out || true
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Vercel Deploy Hook 返回 HTTP ${code}"
            exit 1
          fi

  publish-docker:
    name: Docker 镜像
    needs: [validate, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # 通道 tag 与 npm dist-tag 同源（validate 已解析）：正式版 → latest，预发布 → beta。
      # 两种情况都另打精确版本号 tag，便于固定到某个具体版本。
      - name: 构建并推送 amd64 / arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            TWIKOO_VERSION=${{ needs.validate.outputs.version }}
          tags: |
            imaegoo/twikoo:${{ needs.validate.outputs.npm_tag }}
            imaegoo/twikoo:${{ needs.validate.outputs.version }}
      # arm32v7 只在正式版发布：预发布不构建该架构
      - name: 构建并推送 arm32v7
        if: ${{ !github.event.release.prerelease }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7
          push: true
          tags: |
            imaegoo/twikoo:arm32v7
            imaegoo/twikoo:${{ needs.validate.outputs.version }}-arm32v7
          # arm32v7 命名空间没有 node 的新版本 tag（`:26` 之类不存在），只能用 lts（与 1.x 同底座）
          build-args: |
            NODE_IMAGE=arm32v7/node
            NODE_VERSION=lts
            TWIKOO_VERSION=${{ needs.validate.outputs.version }}

  publish-pkg:
    name: SEA 可执行产物
    needs: [validate, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: 覆写版本号（SEA 产物内的版本号取自 @twikoojs/shared，须与本次发布一致）
        run: node scripts/release-set-version.mjs "${{ needs.validate.outputs.version }}"
      - name: 构建 SEA 依赖的 workspace 产物（shared / pushoo / common / tkserver 等）
        run: pnpm -r --if-present --filter "twikoo-pkg..." run build
      - name: 构建 SEA 产物（目标运行时 nodeVersion 见 packages/pkg/tsdown.config.mts）
        run: pnpm --filter twikoo-pkg build:exe
      - name: 上传产物到已有 Release（不创建 Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" packages/pkg/dist/* --clobber
