packages:
  - "packages/*"
  - "docs"
allowBuilds:
  # @cloudbase/js-sdk（client 的 all 产物内置 SDK，对齐 1.x main.all.js）依赖 core-js-pure，
  # 其 postinstall 仅打印捐赠提示（`node -e "try{require('./postinstall')}catch(e){}"`），
  # 批准是为了 ERR_PNPM_IGNORED_BUILDS 不再使 install 失败。
  core-js-pure: true
  esbuild: true
  # T9: postinstall 仅用于预下载 Mongo 二进制（可用 MONGOMS_DISABLE_POSTINSTALL=1 跳过）；
  # 批准是为了 ERR_PNPM_IGNORED_BUILDS 不再使 install 失败，二进制默认留给首跑下载。
  mongodb-memory-server: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - prettier@3.9.7
# T47 修复：`@xsai/generate-text@0.2.2` 的 dependencies 把 `@xsai/shared-chat` 写成**空范围**（""），
# pnpm 因而解析到最新的 0.5.0——但 0.5.0 已移除 `determineStepType`（更名 resolvePrepareStep 等，
# 见其 dist 导出），`import("@xsai/generate-text")` 会直接抛
# "does not provide an export named 'determineStepType'"（AI 垃圾检测整体不可用）。
# @xsai 各包按同一版本线成对发布，故钉住与 generate-text 版本号一致的 shared-chat。
overrides:
  "@xsai/shared-chat": "0.2.2"
